name: Verifcation

on: workflow_dispatch

jobs:
  lint:
    name: AstroPy Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group verify

      - name: Verify AstroPy
        run: uv run pytest tests/verify
